version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - IDENTITY_SERVICE_URL=http://identity-service:8001
      - CATALOGUE_SERVICE_URL=http://catalogue-service:8002
      - HANDSHAKE_SERVICE_URL=http://handshake-service:8003
      - ORDER_SERVICE_URL=http://order-service:8004
    depends_on:
      - identity-service
      - catalogue-service
      - handshake-service
      - order-service

  identity-service:
    build: ./services/identity-service
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=vendor_identity
      - REDIS_URL=redis://redis:6379
      - CATALOGUE_SERVICE_URL=http://catalogue-service:8002
    depends_on:
      - mongodb
      - redis

  catalogue-service:
    build: ./services/catalogue-service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=vendor_catalogue
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  handshake-service:
    build: ./services/handshake-service
    ports:
      - "8003:8003"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=vendor_handshake
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  order-service:
    build: ./services/order-service
    ports:
      - "8004:8004"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=vendor_order
      - REDIS_URL=redis://redis:6379
      - IDENTITY_SERVICE_URL=http://identity-service:8001
      - CATALOGUE_SERVICE_URL=http://catalogue-service:8002
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
